<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelexy</title><link rel="stylesheet" href="/styles.css"></head><body><main><section id="landing"><h1>Kelexy</h1><p>Private chatroom.</p><button onclick="show('login')">Join Kelexy</button></section><section id="login" class="hidden"><h2>Login</h2><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><button class="link" onclick="show('register')">Register</button></section><section id="register" class="hidden"><h2>Register</h2><form id="registerForm"><input name="username" placeholder="Username" pattern="[A-Za-z0-9_-]{3,}" minlength="3" required><input name="password" type="password" minlength="8" placeholder="Password" required><input name="confirmPassword" type="password" placeholder="Confirm Password" required><label><input type="checkbox" name="rules" required> I accept the 10 rules, confirm I am at least 14, and understand Kelexy is a private project.</label><button>Create account</button></form><button class="link" onclick="show('login')">Back to login</button></section><section id="chat" class="hidden"><h2>Kelexy Chat</h2><div id="messages"></div><form id="messageForm"><input name="body" maxlength="2000" placeholder="Write a message…" required><button>Send</button></form><button class="link" onclick="logout()">Logout</button></section></main><script src="/app.js"></script></body></html>
